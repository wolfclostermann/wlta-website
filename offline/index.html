  html, body { margin: 0; min-height: 100%; background: #15121a; }
  a { color: #ff7a5c; }

  .stage {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #15121a;
    color: #f4f1ec;
    font-family: Barlow, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rays-a, .rays-b {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 300vmax;
    height: 300vmax;
    margin: -150vmax 0 0 -150vmax;
  }
  .rays-a {
    background: conic-gradient(from 200deg,
      #2a1f4a 0deg 40deg, #3b2a66 40deg 85deg, #15121a 85deg 130deg,
      #6b4bb8 130deg 150deg, #2a1f4a 150deg 200deg, #c4577a 200deg 212deg,
      #15121a 212deg 270deg, #3b2a66 270deg 320deg, #ff7a5c 320deg 326deg,
      #2a1f4a 326deg 360deg);
  }
  .rays-b {
    opacity: .3;
    background: repeating-conic-gradient(
      rgba(155,120,255,.35) 0deg 3deg, transparent 3deg 22deg,
      rgba(255,122,92,.3) 22deg 24deg, transparent 24deg 45deg);
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 42%,
      rgba(21,18,26,0) 0%, rgba(21,18,26,.35) 45%, rgba(21,18,26,.92) 100%);
  }
  .frame-border {
    position: absolute;
    inset: 14px;
    border: 6px solid #f4f1ec;
    pointer-events: none;
  }
  main {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 64px 32px;
    max-width: 560px;
    text-align: center;
  }
  .hero {
    position: relative;
    width: min(70vw, 320px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .diamond {
    position: absolute;
    width: 68%;
    aspect-ratio: 1;
    border: 4px solid #9b78ff;
    transform: rotate(45deg) scale(.92);
    box-shadow: 0 0 120px rgba(155,120,255,.45);
  }
  .hero img {
    position: relative;
    width: 100%;
    display: block;
    box-shadow: 0 30px 120px rgba(0,0,0,.7);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font: 600 14px Barlow;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: #ff7a5c;
  }
  .status .dot {
    width: 10px;
    height: 10px;
    background: #ff7a5c;
    display: block;
  }
  h1 {
    margin: 0;
    font: 800 clamp(44px, 12vw, 72px)/.9 'Barlow Condensed', sans-serif;
    text-transform: uppercase;
    text-wrap: balance;
  }
  p {
    margin: 0;
    font: 400 20px/1.45 Barlow;
    color: #d8d1ca;
    text-wrap: pretty;
  }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    padding: 0 32px;
    background: #ff7a5c;
    color: #1a1715;
    font: 600 17px Barlow;
    letter-spacing: .16em;
    text-transform: uppercase;
    text-decoration: none;
  }
  .cta:hover {
    background: #f4f1ec;
    color: #1a1715;

<body>
  <div class="stage">
    <div class="rays-a" id="rays-a"></div>
    <div class="rays-b" id="rays-b"></div>
    <div class="vignette"></div>
    <div class="frame-border"></div>
    <main>
      <div class="hero">
        <div class="diamond" id="diamond"></div>
        <img src="assets/wolf.png" alt="Wolf Like The Animal">
      </div>
      <div class="status">
        <span class="dot" id="dot"></span>Offline
      </div>
      <h1>The service is offline.</h1>
      <p>If you are at a gig right now, go and bug Wolf</p>
      <a class="cta" href="https://linktr.ee/wolflike">linktr.ee/wolflike</a>
    </main>
  </div>

  <script>
    // Direct port of the original design's animation loop -- same math, same
    // timing, just plain DOM instead of React refs. No React/runtime needed:
    // this page has no state and nothing to diff, just four elements whose
    // style properties move every frame.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var raysA = document.getElementById('rays-a');
      var raysB = document.getElementById('rays-b');
      var diamond = document.getElementById('diamond');
      var dot = document.getElementById('dot');
      var t0 = performance.now();
      function tick(now) {
        var t = (now - t0) / 1000, W = 2 * Math.PI / 16;
        var hit = Math.pow(1 - ((t * 2) % 1), 3), amt = 0.6;
        raysA.style.transform = 'rotate(' + (18 * Math.sin(W * t)) + 'deg)';
        raysA.style.filter = 'brightness(' + (1 + hit * amt * 0.5) + ')';
        raysB.style.transform = 'rotate(' + (-45 * t / 16) + 'deg)';
        raysB.style.opacity = (0.25 + hit * amt * 0.5).toFixed(3);
        diamond.style.transform = 'rotate(45deg) scale(' + (0.92 + hit * amt * 0.06) + ')';
        diamond.style.boxShadow = '0 0 ' + (100 + hit * 100) + 'px rgba(155,120,255,' + (0.4 + hit * 0.35).toFixed(2) + ')';
        dot.style.opacity = Math.sin(t * Math.PI) > 0 ? 1 : 0.2;
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
  </script>
</body>
